on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploy website
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        
      # 1. Configuración de pnpm (Tu proyecto usa pnpm)
      - name: ⚙️ Set up pnpm
        uses: pnpm/action-setup@v3 

      # 2. Configuración de Node.js 20+ con caché pnpm
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4 # Usar versión más reciente (v4)
        with:
          node-version: '20' 
          cache: 'pnpm'

      - name: 📦 Install dependencies
        # Usa pnpm. Con el lockfile subido, usará el modo frozen.
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build and Export project
        # 3. Ejecutar Build y Exportación estática (next export) para generar 'out/'
        run: pnpm run build && npx next export
        
      - name: 📂 Sync build folder via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # 4. Usa la carpeta 'out/' generada por 'next export'
          local-dir: out/
          server: ftps4.us.freehostia.com
          username: estavi7
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: scratchup.com.co/
