on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploy website
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # [CORRECCIÓN 1] Configurar pnpm, ya que el proyecto lo usa (pnpm-lock.yaml)
      - name: ⚙️ Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # Versión estable de pnpm
          run_install: false # Deshabilita la instalación automática

      # [CORRECCIÓN 2a] Usar actions/setup-node@v4 (más reciente) y configurar el caché
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'pnpm' # Cachear con pnpm

      - name: 📦 Install dependencies
        # [CORRECCIÓN 2b] Usar pnpm para la instalación
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build and Export project
        # [CORRECCIÓN 3] Ejecutar la construcción Y la exportación estática para generar 'out/'
        # Esto genera la carpeta 'out/' que la acción de FTP necesita.
        run: pnpm run build && npx next export
        
      - name: 📂 Sync build folder via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          local-dir: out/ # RUTA CORREGIDA: Apunta a la carpeta 'out/'
          server: ftps4.us.freehostia.com
          username: estavi7
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: scratchup.com.co/
