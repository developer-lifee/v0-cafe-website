on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploy website
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # 1. Configuración de pnpm 
      - name: ⚙️ Set up pnpm
        uses: pnpm/action-setup@v3 
        with:
          version: 9

      # 2. Configuración de Node.js 20+ con caché pnpm
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'pnpm'

      - name: 📦 Install dependencies
        # Usa el flag temporal si el pnpm-lock.yaml no está sincronizado
        run: pnpm install --no-frozen-lockfile 

      - name: 🏗️ Build project (Genera 'out/' automáticamente)
        # 3. Solo necesitamos 'pnpm run build' ya que 'output: export' está en next.config.mjs
        run: pnpm run build 
        
      - name: 📂 Deploy via FTP using lftp
        env:
          FTP_HOST: ftps4.us.freehostia.com
          FTP_USER: estavi7
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: scratchup.com.co
        run: |
          # Install lftp if not available
          command -v lftp >/dev/null 2>&1 || sudo apt-get install -y lftp
          
          # Create lftp script
          cat > /tmp/deploy.lftp << 'SCRIPT'
          set ftp:ssl-allow true
          set ftp:use-mdtm off
          set net:max-retries 3
          set net:timeout 10
          open ftps://$FTP_USER:$FTP_PASS@$FTP_HOST
          cd $FTP_DIR
          mirror --reverse --continue --delete --verbose ./out/ .
          bye
          SCRIPT
          
          # Run deployment
          lftp -f /tmp/deploy.lftp
