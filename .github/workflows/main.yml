on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploy website
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # 1. Configuración de pnpm (CORRECCIÓN: Se especifica la versión)
      - name: ⚙️ Set up pnpm
        uses: pnpm/action-setup@v3 
        with:
          version: 9 # <--- ESTO SOLUCIONA EL ERROR "No pnpm version is specified"

      # 2. Configuración de Node.js 20+ con caché pnpm
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4 # Usar la versión más reciente del action
        with:
          node-version: '20' 
          cache: 'pnpm'

      - name: 📦 Install dependencies
        # Temporalmente usamos --no-frozen-lockfile para pasar el error de desincronización
        run: pnpm install --no-frozen-lockfile 

      - name: 🏗️ Build and Export project
        # 3. Ejecutar Build y Exportación estática para generar 'out/' (Soluciona el error de 'ENOENT: no such file or directory, scandir out/')
        run: pnpm run build && npx next export
        
      - name: 📂 Sync build folder via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # 4. Usa la carpeta 'out/' generada por 'next export' (Soluciona el error de 'dist/')
          local-dir: out/
          server: ftps4.us.freehostia.com
          username: estavi7
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: scratchup.com.co/
